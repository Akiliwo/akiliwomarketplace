<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Akiliwo Marketplace</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c4434">
<link rel="stylesheet" href="assets/product.css">
<style>
.cart{max-width:720px;margin:24px auto 0}
.cart h1{margin-bottom:16px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.line img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:var(--cream-2)}
.line a{font-weight:700;text-decoration:none;overflow-wrap:anywhere}
.line small{display:block;color:var(--muted)}
.line .amt{font:900 1.1rem Georgia,serif;color:var(--green);white-space:nowrap}
.line .btn{grid-column:2/-1;justify-self:start;padding:9px 14px;font-size:.9rem}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px;font-weight:800}
.total .price{margin:0}
.pay{display:grid;gap:10px;margin:18px 0}
.pay .btn{display:block;font-size:1.05rem}
.btn.mail{background:var(--white);color:var(--green);border:2px solid var(--green)}
.note{font-size:.9rem;color:var(--muted)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="./"><span class="mark">A</span> Akiliwo Marketplace</a><a class="back" href="./#browse">← Keep shopping</a></div></header>
<main class="wrap">
  <section class="cart" id="cart"><p class="empty">Loading your order…</p></section>
</main>
<footer><div class="wrap">© Akiliwo Marketplace LLC · Denver, Colorado · <a href="./">Home</a> · <a href="./#returns">Returns</a> · <a href="./#contact">Contact</a></div></footer>
<script>
/* Checkout page for the Facebook/Instagram shop.
   Meta sends buyers here as checkout.html?products=<id>:<qty>,<id>:<qty>&coupon=CODE
   Ids come from facebook-catalog.csv; assets/checkout-products.json maps them to products
   (both generated by _seo/build_seo.js). */
const WA = '17207994089';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => '$' + n.toFixed(2);
const params = new URLSearchParams(location.search);
const wanted = (params.get('products') || '').split(',').map(x => x.trim()).filter(Boolean).map(x => {
  const i = x.lastIndexOf(':');
  const id = i > 0 ? x.slice(0, i) : x;
  const qty = Math.max(1, Math.min(99, parseInt(i > 0 ? x.slice(i + 1) : '1', 10) || 1));
  return {id, qty};
});
const coupon = (params.get('coupon') || '').trim();
const el = document.getElementById('cart');

fetch('assets/checkout-products.json').then(r => r.json()).then(catalog => {
  const lines = wanted.map(w => ({...w, p: catalog[w.id]})).filter(l => l.p);
  if (!lines.length) {
    el.innerHTML = `<h1>Your order</h1><p class="empty">We couldn't find those items. <a href="./#browse">Browse all products</a> or message us on <a href="https://wa.me/${WA}">WhatsApp</a>.</p>`;
    return;
  }
  const total = lines.reduce((t, l) => t + Number(l.p.price) * l.qty, 0);
  const orderText = 'Hello Akiliwo Marketplace, I would like to order:\n' +
    lines.map(l => `- ${l.qty} x ${l.p.title} (${money(Number(l.p.price))} each)`).join('\n') +
    `\nSubtotal: ${money(total)}` + (coupon ? `\nCoupon: ${coupon}` : '') + '\nIs it available?';
  const cardLines = lines.filter(l => l.p.link && !l.p.sold);
  el.innerHTML = `<h1>Your order</h1>
    ${lines.map(l => `<div class="line">
      ${l.p.image ? `<img src="${esc(l.p.image)}" alt="">` : '<span></span>'}
      <div><a href="${esc(l.p.page)}">${esc(l.p.title)}</a><small>Qty ${l.qty} × ${money(Number(l.p.price))}${l.p.sold ? ' · Sold out' : ''}</small></div>
      <span class="amt">${money(Number(l.p.price) * l.qty)}</span>
      ${l.p.link && !l.p.sold && l.qty === 1 && lines.length > 1 ? `<a class="btn card" href="${esc(l.p.link)}" rel="nofollow noopener">💳 Pay for this item by card</a>` : ''}
    </div>`).join('')}
    <div class="total"><span>Subtotal${coupon ? ` (coupon ${esc(coupon)} applied when we confirm)` : ''}</span><span class="price">${money(total)}</span></div>
    <div class="pay">
      ${lines.length === 1 && lines[0].qty === 1 && cardLines.length === 1 ? `<a class="btn card" href="${esc(cardLines[0].p.link)}" rel="nofollow noopener">💳 Buy now with card</a>` : ''}
      <a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent(orderText)}" rel="nofollow noopener">💬 Order on WhatsApp</a>
      <a class="btn mail" href="mailto:info@akiliwomarketplace.com?subject=${encodeURIComponent('New order')}&body=${encodeURIComponent(orderText)}">✉️ Order by email</a>
    </div>
    <p class="note">${cardLines.length ? 'Card payments are processed securely. ' : ''}For several items, quantities above 1, or items without card payment, send your order on WhatsApp or email and we'll confirm availability, shipping and the total before you pay. Questions? Call or text <a href="tel:+17207994089">+1 720 799 4089</a>.</p>
    <ul class="trust"><li>🔒 Secure checkout</li><li>🚚 Ships from Denver, Colorado (USA)</li><li><a href="./#returns">↩️ 30-day returns</a></li></ul>`;
}).catch(() => {
  el.innerHTML = `<h1>Your order</h1><p class="empty">Something went wrong loading your order. Please message us on <a href="https://wa.me/${WA}">WhatsApp</a>.</p>`;
});
</script>
</body>
</html>
